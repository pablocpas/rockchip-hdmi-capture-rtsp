[main]
device=/dev/v4l/by-id/usb-MACROSILICON_USB3_Video_20210623-video-index0
audio-device=hw:CARD=Video,DEV=0
video-codec=h264
audio-codec=opus
audio-gain=3.0
audio-frame-ms=20
stream-profile=mjpeg
width=1920
height=1080
fps=50
bitrate=18000000
gop=50
rtp-payload=1400
cpu-governor=performance
listen-rtsp=:8554
rtsp-path=/capture
max-clients=3
rtsp-debug=false

# Optional extra profiles. Each profile inherits [main] and overrides only the
# keys listed in its section.
# [profile.720p50]
# path=/720p50
# stream-profile=rga
# width=1280
# height=720
# fps=50
# codec=h265
# bitrate=4000000
# gop=50
