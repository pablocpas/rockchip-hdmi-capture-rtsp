[capture]
device=/dev/v4l/by-id/usb-MACROSILICON_USB3_Video_20210623-video-index0
audio-device=hw:CARD=Video,DEV=0
audio=true
audio-codec=opus
audio-gain=3.0
audio-frame-ms=20
stream-profile=mjpeg
width=1920
height=1080
fps=50
video-codec=h264
rc-mode=vbr
bitrate=15000000
gop=50
rtp-payload=1400
listen-rtsp=:8554
rtsp-path=/hq
rtsp-send-timeout-ms=3000
max-clients=5
rtsp-debug=false

# Simultaneous on-demand output streams sharing the same HDMI capture + audio.
# Each encoder/scaler is only created while a client is connected to its path.

[stream.h265]
path=/h265
codec=h265
bitrate=6000000
rc-mode=vbr
gop=50
rtsp-send-timeout-ms=6000

[stream.coche]
path=/coche
codec=h265
width=1280
height=720
fps=25
bitrate=2000000
rc-mode=vbr
gop=25
rtsp-send-timeout-ms=10000

[stream.audio]
path=/audio
video=false
audio=true
rtsp-send-timeout-ms=12000
